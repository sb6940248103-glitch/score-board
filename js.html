<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Counter - Ping Pong Dash Theme</title>
    <!-- เพิ่ม FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 📍 ปรับธีมสีให้เข้ากับภาพปิงปอง Dash!! */
            --primary-color: #0d0f12;
            --team-a-color: #f97316;   /* สีส้มสดใส (โทนเล่ม 10 / ตัวหนังสือส้ม) */
            --team-b-color: #eab308;   /* สีเหลืองทอง (โทนสีผม / โลโก้ Dash) */
            --accent-gold: #facc15;    /* สีทองสว่างสำหรับเน้นผู้ชนะ */
            --card-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* กำหนดรูปภาพ ie.jpg เป็นพื้นหลัง */
            background-image: url("ie.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        /* กรอบหลักภายนอก (เน้นสไตล์สีดำตัดขอบเรืองแสงสีทอง) */
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(10, 10, 15, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(234, 179, 8, 0.4);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        .header {
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        h1 i {
            color: var(--team-a-color);
        }

        .subtitle {
            color: #e2e8f0;
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 📍 แสดงผลผู้ชนะ */
        #result {
            margin-bottom: 20px;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
            min-height: 2.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ตารางจัดวางการ์ดคะแนนทั้งสองทีม */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* กรอบย่อยของแต่ละทีม */
        .team-card {
            background: rgba(24, 24, 27, 0.8);
            border-radius: 18px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .team-card.team-a {
            border-top: 5px solid var(--team-a-color);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.15);
        }

        .team-card.team-b {
            border-top: 5px solid var(--team-b-color);
            box-shadow: 0 8px 20px rgba(234, 179, 8, 0.15);
        }

        .team-card:hover {
            transform: translateY(-3px);
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .team-a .score-display { 
            color: var(--team-a-color); 
            text-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
        }
        .team-b .score-display { 
            color: var(--team-b-color); 
            text-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .btn-add-a { 
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }
        .btn-add-b { 
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); 
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
            color: #1a1a1a;
        }

        .btn-reset {
            background: #f38d18;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 36px;
            font-size: 1rem;
            color: #f1f5f9;
        }
        
        .btn-reset:hover {
            background: #b3ce51;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <h1><i class="fa-solid fa-table-tennis-paddle-ball"></i> PING PONG DASH!</h1>
            <p class="subtitle">ทีมที่ได้ 5 คะแนนก่อนจะเป็นผู้ชนะ!</p>
        </div>

        <!-- ข้อความแจ้งเตือนผู้ชนะ -->
        <div id="result"></div>

        <div class="scoreboard">
            <!-- กรอบทีม A (ส้มแสด) -->
            <div class="team-card team-a">
                <div id="set1" call="set1 display">SET : 0</div>
                <div id="show1" class="score-display">Team A: 0</div>
                <div class="btn-group">
                    <button class="btn-add-a" onclick="add()">+1 Score</button>
                    <button onclick="aaa()">-1 Score</button>
                </div>
            </div>

            <!-- กรอบทีม B (เหลืองทอง) -->
            <div class="team-card team-b">
                <div id="set2" call="set2 display">SET : 0</div>
                <div id="show" class="score-display">Team B: 0</div>
                <div class="btn-group">
                    <button class="btn-add-b" onclick="bbb()">+1 Score</button>
                    <button onclick="ccc()">-1 Score</button>
                </div>
            </div>
        </div>

        <button class="btn-reset" onclick="reset()">Reset All</button>
    </div>

    <script>
        let x = 0;
        let y = 0;
        let setA = 0;
        let setB = 0;

        function add(){
            x++;
            show1();
            check();
        }

        function aaa(){
            if (x > 0) x--; /* ป้องกันคะแนนติดลบ */
            show1();
        } 

        function show1(){
            document.getElementById('show1').innerHTML = 'Team A : ' + x;
            document.getElementById('set1').innerHTML = 'SET :' +setA;
        }

        function bbb(){
            y++;
            show();
            check();
        }

        function ccc(){
            if (y > 0) y--; /* ป้องกันคะแนนติดลบ */
            show();
        } 

        function show(){
            document.getElementById('show').innerHTML = 'Team B : ' + y;
            document.getElementById('set2').innerHTML = 'SET :' +setB;
        }

         function check(){ 
            // เมื่อมีทีมใดได้ 5 คะแนน
            if (x >= 11) {
                setA++; // บวกเซตให้ Team A
                document.getElementById('result').innerHTML = "🔥 Team A Wins Set! 🔥";
                resetScore(); // รีเซ็ตเฉพาะคะแนนเกมเพื่อขึ้นเซตใหม่
            } else if (y >= 11) {
                setB++; // บวกเซตให้ Team B
                document.getElementById('result').innerHTML = "⚡ Team B Wins Set! ⚡";
                resetScore(); // รีเซ็ตเฉพาะคะแนนเกมเพื่อขึ้นเซตใหม่
            }
        }
        
        
        function resetScore(){
            x = 0;
            y = 0;
            document.getElementById('result').innerHTML = "";
            show1();
            show();
        }
        function resetAll(){
            x = 0;
            y = 0;
            setA = 0;
            setB = 0;
            document.getElementById('result').innerHTML = "";
            show1();
            show();
        }
        // แสดงผลเริ่มต้น
        show1();
        show();
    </script>
</body>
</html>
